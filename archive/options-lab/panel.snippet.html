<!-- Fixed bottom-left options panel — paste into page when testing variants -->
<aside class="options-lab" aria-label="Interaction options tester">
  <div class="options-lab__title">Options</div>
  <div class="options-lab__options" role="radiogroup" aria-label="Choose option">
    <button type="button" class="options-lab__option is-active" data-option="a" role="radio" aria-checked="true">1 · Option A</button>
    <button type="button" class="options-lab__option" data-option="b" role="radio" aria-checked="false">2 · Option B</button>
  </div>
  <div class="options-lab__hint">Switch options and preview on the page.</div>
</aside>
